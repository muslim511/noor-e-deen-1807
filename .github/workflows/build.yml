
name: Build Noor-e-Deen APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Prepare Android project
        run: |
          mkdir -p app/src/main/assets
          cp noor-e-deen.html app/src/main/assets/index.html
          echo "Source file prepared"
